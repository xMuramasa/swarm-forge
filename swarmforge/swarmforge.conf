# Format: window[-invisible] <role> <agent> <worktree> [task|batch] [forward-only|back-one|back-all] [extra-cli-args...]
# File order is the forward route: specifier -> coder -> architect -> QA.
# Any fields after the receive-mode and propagation tokens go to the agent CLI.
# Heavy models where the work is judgement (specifying, architecture, hardening),
# a lighter one where it is mostly execution (coding, QA).
window specifier claude master --model opus
window coder claude coder --model sonnet
window architect claude architect batch back-all --model opus
window QA claude QA batch back-all --model sonnet
